"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "pnpm install"
run_mode = "concurrent"

[scripts.run.dev]
command = "pnpm dev --port $CONDUCTOR_PORT"
default = true
icon = "play"

# The MCP server, which the docs' page menu links to (mcp/port.mjs picks its port).
[scripts.run.mcp]
command = "pnpm dev:mcp"
