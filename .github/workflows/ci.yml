name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-types:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also runs `nuxt prepare` for the site and the MCP server (postinstall), which
      # writes the .nuxt tsconfigs.
      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main
      - run: pnpm check-types
      # The component pages show app/reference/ as code: fails if they drift apart.
      - run: pnpm check-reference

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main
      # The reference implementations' tests, which the component pages show as code,
      # and the contracts, validated against public/schemas/contract.json.
      - run: pnpm test

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        id: install
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main
      # oxfmt with the shared @uxfront config (oxfmt.config.ts): fails on any file that
      # `pnpm format` would change.
      - name: Format
        run: pnpm format:check
      # The checks are independent, so each one reports even when an earlier one failed.
      # oxlint with the shared @uxfront config (oxlint.config.ts). Errors fail the job, and
      # warnings only annotate the PR.
      - name: Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: pnpm lint --format=github

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main
      # Fails on any page that doesn't prerender (`failOnError` in nuxt.config.ts).
      - run: pnpm build
      # What search engines and AI crawlers get: the sitemap's pages and their head
      # tags, robots.txt, llms.txt, the markdown copies and the noindex headers.
      - run: pnpm check-seo
      # The MCP server (mcp/), a Worker of its own.
      - run: pnpm build:mcp
      # Serves the MCP server with wrangler dev, the way Cloudflare will, and checks
      # every tool, resource and prompt against the built site.
      - run: pnpm check-mcp
