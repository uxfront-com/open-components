# Audits the homepage nightly with the shared Lighthouse workflow, which skips a
# scheduled run when main hasn't moved since the last audit. Run it by hand from
# the Actions tab at any time: a manual run always audits.
name: Lighthouse

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  # Tests the caller itself, and each later pin bump, before it merges.
  pull_request:
    paths: [.github/workflows/lighthouse.yml]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lighthouse:
    name: Lighthouse
    permissions:
      actions: read # the change check reads earlier runs
      contents: read
    uses: uxfront-com/.github/.github/workflows/lighthouse.yml@d2f86bc4b9602818601b0415509c5be0348bb8bc # main
    with:
      build: pnpm build
      # Serves dist and fails below 0.95 in any category (lighthouserc.mjs), using
      # the runner's Chrome.
      audit: pnpm lighthouse
      reports: .lighthouseci
