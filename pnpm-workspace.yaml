allowBuilds:
  # Only an auto-installed peer of @nuxt/content: Docus reads content with the
  # built-in node:sqlite, so the native binding is never built.
  better-sqlite3: false
  esbuild: true
  # Comes in through ipx, nuxt-og-image and miniflare, which use its prebuilt
  # binaries. pnpm installs those as optional dependencies, so it needs no build.
  sharp: false
  # Its postinstall only switches the build to Vue 2; the default build is Vue 3's.
  vue-demi: false
  # Wrangler's runtime, for `wrangler dev`. Its postinstall only checks for the
  # platform's binary, which pnpm installs as an optional dependency.
  workerd: false
overrides:
  # @nuxtjs/partytown (2.0.0) asks for ^0.11.0, which reads deprecated members
  # when it mirrors the page for its worker: attributionSrc on every element, and
  # HTMLFencedFrameElement and window.fence on the window. Chrome logs a
  # deprecation for each, and Lighthouse's Best Practices drops to 81. 1.0.5 skips
  # all three (1.0.0 only marked Partytown stable). Drop this once
  # @nuxtjs/partytown depends on 1.0.5 or later.
  "@nuxtjs/partytown>@qwik.dev/partytown": 1.0.5
minimumReleaseAgeExclude:
  - "@uxfront/layer-docs@0.9.1"
  - "@uxfront/layer-ui@0.1.11"
  - "@uxfront/scene@0.5.1"
  - "@uxfront/site-checks@0.1.0"
  - "@uxfront/ui@0.9.1"
  - "@uxfront/oxlint-config@0.2.0"
  - "@uxfront/oxfmt-config@0.2.0"
