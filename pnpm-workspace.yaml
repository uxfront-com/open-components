allowBuilds:
  # Only an auto-installed peer of @nuxt/content: Docus reads content with the
  # built-in node:sqlite, so the native binding is never built.
  better-sqlite3: false
  esbuild: true
  # Its postinstall only switches the build to Vue 2; the default build is Vue 3's.
  vue-demi: false
overrides:
  # @nuxtjs/partytown (2.0.0) asks for ^0.11.0, which reads the deprecated
  # attributionSrc of every element when it mirrors the page for its worker:
  # Chrome logs a deprecation, and the homepage loses its Best Practices 100.
  # 0.14 skips it. Drop this once @nuxtjs/partytown depends on 0.14.
  '@nuxtjs/partytown>@qwik.dev/partytown': 0.14.4
minimumReleaseAgeExclude:
  - '@uxfront/layer-ui@0.1.2'
  - '@uxfront/ui@0.3.0'
